services:
  mariadb:
    image: mariadb:11
    container_name: gym_mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: 12345
      MARIADB_DATABASE: gym_db
      MARIADB_USER: gym_app
      MARIADB_PASSWORD: root

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro

    networks:
      - gym_network

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: gym_backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000

      DATABASE_HOST: mariadb
      DATABASE_USER: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: gym_db

      JWT_SECRET: ${JWT_SECRET}

      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

    expose:
      - "5000"

    depends_on:
      mariadb:
        condition: service_healthy

    networks:
      - gym_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: gym_frontend
    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      - backend

    networks:
      - gym_network

  caddy:
    image: caddy:2
    container_name: gym_caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - frontend

    networks:
      - gym_network

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:

networks:
  gym_network:
    driver: bridge
